<!doctype html>

<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0f2945"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Familingo"><meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Familingo — Spanish for our next adventure</title>
<style>
:root{--navy:#0f2945;--cream:#fffaf0;--red:#dc3f3f;--yellow:#f5c34b;--teal:#3e9b90;--muted:#728197;--line:#e8e3da;--green:#36a66f}*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:linear-gradient(#f5fbff,#fffaf0 45%,#f6f3ed);color:var(--navy)}button{font:inherit;cursor:pointer}.app{max-width:540px;min-height:100vh;margin:auto;background:rgba(255,255,255,.75);padding-bottom:88px}.top{position:sticky;top:0;z-index:10;display:flex;justify-content:space-between;align-items:center;padding:16px 18px;background:rgba(255,255,255,.94);border-bottom:1px solid var(--line);backdrop-filter:blur(12px)}.brand{font-weight:900;font-size:22px;display:flex;gap:9px;align-items:center}.mark{width:34px;height:34px;border-radius:12px;background:linear-gradient(135deg,var(--red),var(--yellow));display:grid;place-items:center;color:#fff}.chip,.btn,.soft{border:0;border-radius:14px;font-weight:800}.chip{padding:9px 12px;background:#eef7f5;color:#287970}.screen{padding:18px}.hero{background:linear-gradient(135deg,#173b61,#0f2945);color:#fff;border-radius:26px;padding:22px;box-shadow:0 14px 35px #0f29451a}.hero h1{font-size:31px;margin:6px 0}.hero p{color:#d7e4ee}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{padding:12px;border-radius:16px;background:#ffffff12;border:1px solid #ffffff18}.stat b{display:block;font-size:19px}.muted{color:var(--muted)}.tiny{font-size:12px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:16px;margin-top:13px;box-shadow:0 8px 22px #1238580c}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.start{display:flex;align-items:center;gap:12px}.ico{width:44px;height:44px;border-radius:14px;background:#eef7f5;display:grid;place-items:center;font-size:22px}.prog{height:10px;border-radius:999px;background:#edf0f2;overflow:hidden}.prog span{display:block;height:100%;background:linear-gradient(90deg,var(--teal),#63bea9)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.activity{min-height:120px;border:1px solid var(--line);background:#fff;border-radius:18px;padding:14px;text-align:left}.activity b{display:block;margin:8px 0 3px}.btn{padding:13px 15px;background:var(--teal);color:#fff;min-height:48px}.soft{padding:11px 13px;background:#eef7f5;color:#287970}.wide{width:100%}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(540px,100%);display:grid;grid-template-columns:repeat(5,1fr);padding:8px 6px max(9px,env(safe-area-inset-bottom));background:#fffffff2;border-top:1px solid var(--line);backdrop-filter:blur(12px)}.nav button{border:0;background:transparent;color:#8793a0;font-size:10px;font-weight:800}.nav .n{display:block;font-size:20px}.nav .on{color:#287970}.lesson{display:flex;align-items:center;gap:11px;border:1px solid var(--line);border-radius:18px;padding:13px;background:#fff;margin:9px 0}.lesson.done{border-color:#b8dfd5;background:#f6fffb}.lesson.lock{opacity:.5}.num{width:38px;height:38px;border-radius:12px;background:#eef7f5;display:grid;place-items:center;font-weight:900}.meta{flex:1}.eyebrow{text-transform:uppercase;letter-spacing:.12em;font-size:10px;font-weight:900;color:#287970}h1{font-size:30px;line-height:1.08;margin:5px 0 8px}h2{font-size:20px;margin:0 0 10px}.leader{display:flex;gap:11px;align-items:center;padding:11px 0;border-bottom:1px solid #f1ede7}.leader:last-child{border-bottom:0}.avatar{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#f0f4f6;font-size:21px}.rank{width:24px;font-weight:900}.reward{padding:14px;border:1px solid var(--line);border-radius:18px;margin:10px 0;background:#fff}.modalbg{position:fixed;z-index:50;inset:0;background:#07192699;display:flex;align-items:flex-end;justify-content:center}.modal{width:min(540px,100%);background:#fff;border-radius:26px 26px 0 0;padding:20px 18px max(22px,env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.profiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}.prof{border:1px solid var(--line);background:#fff;border-radius:18px;padding:16px;text-align:left}.prof.sel{border-color:#7fc7b8;background:#f0fbf7}.q{font-size:25px;font-weight:900;margin:24px 0 16px}.answer{width:100%;border:2px solid #e5eaed;background:#fff;border-radius:16px;padding:14px;text-align:left;font-weight:800;margin:7px 0}.answer.good{border-color:#5bb483;background:#effaf3}.answer.bad{border-color:#df6b65;background:#fff0ef}.feedback{padding:14px;border-radius:16px;margin-top:14px;font-weight:800}.ok{background:#effaf3;color:#24694a}.no{background:#fff1ed;color:#9a3a31}.big{font-size:34px;font-weight:900;text-align:center;margin:30px 0 8px}.speak{width:80px;height:80px;border-radius:50%;border:0;background:var(--teal);color:#fff;font-size:31px;margin:16px auto;display:block}.bubble{max-width:86%;padding:12px 14px;border-radius:17px;margin:9px 0;line-height:1.4}.bot{background:#f1f4f6}.user{background:#eaf8f4;margin-left:auto}.choice{width:100%;border:1px solid #dce4e7;background:#fff;border-radius:15px;padding:12px;text-align:left;margin:7px 0}.score{width:150px;height:150px;border-radius:50%;margin:15px auto;display:grid;place-items:center;background:conic-gradient(var(--teal) calc(var(--v)*3.6deg),#edf0f2 0);position:relative}.score:after{content:"";position:absolute;inset:13px;background:#fff;border-radius:50%}.score b{position:relative;z-index:2;font-size:38px}.toast{position:fixed;z-index:100;left:50%;bottom:100px;transform:translateX(-50%);background:#0f2945;color:white;padding:11px 16px;border-radius:999px;font-weight:800;box-shadow:0 10px 30px #0003}.hide{display:none!important}

<body><div id="app"></div>
<script>
const LESSONS=[
{id:'greet',stage:1,icon:'👋',title:'Greetings & Introductions',xp:20,qs:[['What does “Hola” mean?',['Goodbye','Hello','Please'],1],['How do you say “Good morning”?',['Buenos días','Buenas noches','Gracias'],0],['How do you say “My name is Dave”?',['Me llamo Dave','Tengo Dave','Soy llamo Dave'],0],['How do you say “Nice to meet you”?',['Mucho gusto','Hasta luego','De nada'],0]]},
{id:'polite',stage:1,icon:'🙏',title:'Please, Thanks & Excuse Me',xp:20,qs:[['“Por favor” means…',['Please','Sorry','Tomorrow'],0],['“Gracias” means…',['Hello','Thank you','Maybe'],1],['How do you say “Excuse me”?',['Perdón','Agua','Aquí'],0],['“De nada” means…',['Good morning','You’re welcome','Where?'],1]]},
{id:'numbers',stage:1,icon:'🔢',title:'Numbers & Ages',xp:20,qs:[['What is “diez”?',['5','10','20'],1],['“Tengo quince años” means…',['I am 15 years old','I have 15 euros','It is 15:00'],0],['What is “veinte”?',['12','20','30'],1],['How do you say “How old are you?”',['¿Cuántos años tienes?','¿Dónde vives?','¿Qué hora es?'],0]]},
{id:'help',stage:1,icon:'🛟',title:'When You Need Help',xp:20,qs:[['“No entiendo” means…',['I don’t understand','I don’t want it','I don’t know him'],0],['How do you ask someone to repeat more slowly?',['¿Puede repetirlo más despacio?','¿Dónde está el baño?','¿Cuánto cuesta?'],0],['“Necesito ayuda” means…',['I need help','I need water','I need a taxi'],0],['“¿Habla inglés?” means…',['Do you speak English?','Are you English?','Where is England?'],0]]},
{id:'drinks',stage:2,icon:'🥤',title:'Ordering Drinks',xp:25,qs:[['How do you say “I would like a beer, please”?',['Quisiera una cerveza, por favor','Tengo una cerveza','La cerveza está aquí'],0],['“Agua sin gas” means…',['Sparkling water','Still water','Hot water'],1],['“La cuenta, por favor” means…',['The bill, please','A table, please','A coffee, please'],0],['How do you say “Two coffees”?',['Dos cafés','Café dos','Dos agua'],0]]},
{id:'food',stage:2,icon:'🍽️',title:'Ordering Food',xp:25,qs:[['“Una mesa para cuatro, por favor” means…',['A table for four, please','Four menus, please','Four coffees, please'],0],['“Me gustaría…” is used for…',['I would like…','I dislike…','I forgot…'],0],['How do you ask for the menu?',['El menú, por favor','La calle, por favor','El hotel, por favor'],0],['“¿Tienen opciones vegetarianas?” means…',['Do you have vegetarian options?','Do you have a reservation?','Do you have breakfast?'],0]]},
{id:'directions',stage:2,icon:'🗺️',title:'Asking Directions',xp:25,qs:[['“¿Dónde está…?” means…',['How much is…?','Where is…?','What time is…?'],1],['“A la derecha” means…',['To the right','To the left','Straight on'],0],['“Todo recto” means…',['Turn around','Straight ahead','Nearby'],1],['How do you ask “Where is the beach?”',['¿Dónde está la playa?','¿Cuánto cuesta la playa?','¿A qué hora la playa?'],0]]},
{id:'shopping',stage:2,icon:'🛍️',title:'Shopping',xp:25,qs:[['“¿Cuánto cuesta?” means…',['Where is it?','How much does it cost?','Can I try it?'],1],['How do you say “Too expensive”?',['Demasiado caro','Muy pequeño','Muy tarde'],0],['“Quiero este” means…',['I want this one','I have this one','I lost this one'],0],['How do you ask “Can I pay by card?”',['¿Puedo pagar con tarjeta?','¿Puedo ir al hotel?','¿Puedo tener agua?'],0]]},
{id:'hotel',stage:3,icon:'🏨',title:'Hotel Check-in',xp:30,qs:[['“Tengo una reserva” means…',['I have a reservation','I need a room','I want breakfast'],0],['“¿A qué hora es el desayuno?” means…',['What time is breakfast?','Where is breakfast?','How much is breakfast?'],0],['How do you ask for the Wi-Fi password?',['¿Cuál es la contraseña del wifi?','¿Dónde está el taxi?','¿Cuánto cuesta el wifi?'],0],['“La habitación” means…',['The room','The key','The lift'],0]]},
{id:'taxi',stage:3,icon:'🚕',title:'Taxi Spanish',xp:30,qs:[['“Al aeropuerto, por favor” means…',['To the airport, please','To the hotel, please','Stop here, please'],0],['“Pare aquí, por favor” means…',['Wait here','Stop here, please','Turn here'],1],['How do you ask “How long will it take?”',['¿Cuánto tardará?','¿Cuánto cuesta?','¿Dónde vamos?'],0],['“Más despacio” means…',['Faster','More slowly','More loudly'],1]]},
{id:'time',stage:3,icon:'🕒',title:'Time & Opening Hours',xp:30,qs:[['“¿A qué hora abre?” means…',['What time does it open?','Where does it open?','How much is it?'],0],['“Cierra a las ocho” means…',['It opens at eight','It closes at eight','It costs eight'],1],['“Hoy” means…',['Tomorrow','Today','Yesterday'],1],['“Mañana” can mean…',['Morning or tomorrow','Tonight only','Yesterday'],0]]},
{id:'plans',stage:3,icon:'📅',title:'Making Simple Plans',xp:30,qs:[['“Vamos a la playa” means…',['We are going to the beach','We came from the beach','The beach is closed'],0],['“¿Quieres venir?” means…',['Do you want to come?','Where are you going?','Can you drive?'],0],['“A las siete” means…',['At seven','In seven days','Seven people'],0],['“Nos vemos luego” means…',['See you later','Good morning','I don’t know'],0]]}
];
const CONV={restaurant:{emoji:'🍽️',title:'Restaurant',steps:[['¡Buenas tardes! ¿Una mesa para cuántas personas?','Good afternoon! A table for how many people?',['Una mesa para cuatro, por favor.','Una cerveza, por favor.']],['Perfecto. ¿Qué les gustaría beber?','Perfect. What would you like to drink?',['Agua y dos cervezas, por favor.','La cuenta, por favor.']],['Muy bien. ¿Están listos para pedir?','Very good. Are you ready to order?',['Sí. Me gustaría la paella.','¿Dónde está la playa?']]]},hotel:{emoji:'🏨',title:'Hotel check-in',steps:[['Buenas tardes. ¿Tiene una reserva?','Good afternoon. Do you have a reservation?',['Sí, tengo una reserva.','La cuenta, por favor.']],['¿A nombre de quién?','Under what name?',['A nombre de Morris.','Quisiera un café.']],['Perfecto. Su habitación está en la segunda planta.','Perfect. Your room is on the second floor.',['Gracias. ¿Cuál es la contraseña del wifi?','¿Cuánto cuesta la playa?']]]},taxi:{emoji:'🚕',title:'Taxi',steps:[['Hola. ¿Adónde quiere ir?','Hello. Where would you like to go?',['Al aeropuerto, por favor.','Una mesa para cuatro.']],['Claro. Tardaremos unos veinte minutos.','Of course. It will take about twenty minutes.',['Perfecto, gracias.','La cuenta, por favor.']]]},shop:{emoji:'🛍️',title:'Shopping',steps:[['Hola. ¿Le puedo ayudar?','Hello. Can I help you?',['Sí. ¿Cuánto cuesta esto?','Un café, por favor.']],['Cuesta treinta euros.','It costs thirty euros.',['¿Puedo pagar con tarjeta?','¿Dónde está el hotel?']]]}};
const BASE={current:'dave',coins:420,selected:'takeaway',profiles:{dave:{name:'Dave',avatar:'🧔',xp:0,week:0,streak:1,best:1,done:[],score:8},sam:{name:'Sam',avatar:'👩',xp:0,week:0,streak:1,best:1,done:[],score:8},c1:{name:'Child 1',avatar:'🧑',xp:0,week:0,streak:1,best:1,done:[],score:8},c2:{name:'Child 2',avatar:'👧',xp:0,week:0,streak:1,best:1,done:[],score:8}},rewards:[['film','🎬','Choose Friday film',500],['takeaway','🍕','Takeaway night',1000],['activity','🎳','Family activity',2500],['day','🏖️','Family day out',5000]]};
let S;try{S=JSON.parse(localStorage.getItem('familingo_live_v1'))||structuredClone(BASE)}catch{S=structuredClone(BASE)}let view='home',lesson=null,qi=0,correct=0,conv=null,ci=0;const $=s=>document.querySelector(s),save=()=>localStorage.setItem('familingo_live_v1',JSON.stringify(S)),p=()=>S.profiles[S.current],esc=s=>String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function top(){return `<div class="top"><div class="brand"><div class="mark">F</div>Familingo</div><button class="chip" onclick="profiles()">${p().avatar} ${esc(p().name)}⌄</button></div>`}function nav(){return `<div class="nav">${[['home','🏠','Home'],['learn','📚','Learn'],['family','👨‍👩‍👧‍👦','Family'],['rewards','🎁','Rewards'],['profile','👤','Profile']].map(x=>`<button class="${view===x[0]?'on':''}" onclick="go('${x[0]}')"><span class="n">${x[1]}</span>${x[2]}</button>`).join('')}</div>`}function shell(x,n=true){$('#app').innerHTML=`<div class="app">${top()}${x}${n?nav():''}</div>`}function go(v){view=v;lesson=conv=null;render()}
function rank(){return Object.values(S.profiles).sort((a,b)=>b.week-a.week).indexOf(p())+1}function nextLesson(){return LESSONS.find(l=>!p().done.includes(l.id))||LESSONS[0]}function render(){if(lesson)return lessonScreen();if(conv)return convScreen();({home,learn,family,rewards,profile}[view]||home)()}
function home(){let n=nextLesson(),today=Math.min(50,p().week);shell(`<section class="screen"><div class="hero"><div class="eyebrow" style="color:#86d1c5">Spanish for our next adventure</div><h1>¡Hola, ${esc(p().name)}!</h1><p>Little wins today. Real conversations tomorrow.</p><div class="stats"><div class="stat"><b>🔥 ${p().streak}</b><span class="tiny">day streak</span></div><div class="stat"><b>⭐ ${p().xp}</b><span class="tiny">total XP</span></div><div class="stat"><b>#${rank()}</b><span class="tiny">family rank</span></div></div></div><div class="card"><div class="row"><b>Today’s goal</b><b>${today}/50 XP</b></div><div class="prog" style="margin-top:10px"><span style="width:${today/50*100}%"></span></div></div><button class="card wide" onclick="startLesson('${n.id}')" style="text-align:left"><div class="start"><div class="ico">${n.icon}</div><div class="meta"><div class="eyebrow">Continue learning</div><h2 style="margin:3px 0">${esc(n.title)}</h2><span class="muted tiny">+${n.xp} XP</span></div><b>›</b></div></button><h2 style="margin-top:22px">Today’s practice</h2><div class="grid"><button class="activity" onclick="go('learn')"><div class="ico">⚡</div><b>Quick lesson</b><span class="muted tiny">3–7 minutes</span></button><button class="activity" onclick="speak('¿Puede repetirlo más despacio?')"><div class="ico">🎧</div><b>Listening</b><span class="muted tiny">Hear Spanish</span></button><button class="activity" onclick="speak('Hola, me llamo ${esc(p().name)}')"><div class="ico">🎙️</div><b>Speaking</b><span class="muted tiny">Say it aloud</span></button><button class="activity" onclick="startConv('restaurant')"><div class="ico">💬</div><b>Conversation</b><span class="muted tiny">Restaurant roleplay</span></button></div><div class="card"><div class="row"><h2 style="margin:0">Family league</h2><button class="soft" onclick="go('family')">See all</button></div>${leaders(3)}</div></section>`)}
function unlocked(l){if(l.stage===1)return true;if(l.stage===2)return p().done.filter(id=>LESSONS.find(x=>x.id===id)?.stage===1).length>=2;if(l.stage===3)return p().done.filter(id=>LESSONS.find(x=>x.id===id)?.stage===2).length>=2}function learn(){shell(`<section class="screen"><div class="eyebrow">Learning journey</div><h1>Learn Spanish you’ll use</h1><p class="muted">Work through real situations, not random vocabulary.</p>${[1,2,3].map(st=>`<h2 style="margin-top:22px">${st}. ${['','Survival Spanish','Everyday Spanish','Sentence Building'][st]}</h2>${LESSONS.filter(l=>l.stage===st).map(l=>{let u=unlocked(l),d=p().done.includes(l.id);return `<button class="lesson wide ${d?'done':''} ${u?'':'lock'}" ${u?'':'disabled'} onclick="startLesson('${l.id}')"><div class="num">${d?'✓':l.icon}</div><div class="meta"><b>${esc(l.title)}</b><div class="muted tiny">+${l.xp} XP</div></div><b>${u?(d?'⭐':'›'):'🔒'}</b></button>`}).join('')}`).join('')}</section>`)}
function startLesson(id){lesson=LESSONS.find(x=>x.id===id);qi=0;correct=0;render()}function lessonScreen(){let q=lesson.qs[qi];shell(`<section class="screen"><div class="row"><button class="soft" onclick="exitLesson()">✕</button><div class="prog" style="flex:1"><span style="width:${qi/lesson.qs.length*100}%"></span></div><b>${qi+1}/${lesson.qs.length}</b></div><div class="eyebrow" style="margin-top:22px">${esc(lesson.title)}</div><div class="q">${esc(q[0])}</div><div id="answers">${q[1].map((a,i)=>`<button class="answer" onclick="answer(${i})">${esc(a)}</button>`).join('')}</div><div id="fb"></div></section>`,false)}function answer(i){let q=lesson.qs[qi],ans=[...document.querySelectorAll('.answer')];ans.forEach((e,j)=>e.disabled=true);if(i===q[2]){correct++;ans[i].classList.add('good');$('#fb').innerHTML='<div class="feedback ok">✓ Great — that’s right.</div><button class="btn wide" style="margin-top:10px" onclick="nextQ()">Continue</button>'}else{ans[i].classList.add('bad');ans[q[2]].classList.add('good');$('#fb').innerHTML=`<div class="feedback no">Almost. The correct answer is “${esc(q[1][q[2]])}”.</div><button class="btn wide" style="margin-top:10px" onclick="nextQ()">Continue</button>`}}function nextQ(){qi++;qi>=lesson.qs.length?finishLesson():lessonScreen()}function exitLesson(){lesson=null;view='learn';render()}function finishLesson(){let first=!p().done.includes(lesson.id),earn=first?lesson.xp:5;if(first)p().done.push(lesson.id);p().xp+=earn;p().week+=earn;p().streak=Math.max(1,p().streak);p().best=Math.max(p().best,p().streak);p().score=Math.min(100,8+p().done.length*4+Math.round(correct/lesson.qs.length*8));if(p().week>=50&&!p().coin){S.coins+=10;p().coin=true}save();let title=lesson.title;lesson=null;shell(`<section class="screen" style="text-align:center;padding-top:50px"><div style="font-size:66px">🎉</div><div class="eyebrow">Lesson complete</div><h1>${esc(title)}</h1><div style="font-size:42px;font-weight:900;color:#287970">+${earn} XP</div><p class="muted">${correct}/${LESSONS.find(x=>x.title===title).qs.length} correct first time.</p><button class="btn wide" onclick="go('learn')">Continue learning</button><button class="soft wide" style="margin-top:10px" onclick="go('family')">See family league</button></section>`,false)}
function leaders(n=9){return Object.entries(S.profiles).sort((a,b)=>b[1].week-a[1].week).slice(0,n).map(([id,x],i)=>`<div class="leader"><div class="rank">${['🥇','🥈','🥉'][i]||i+1}</div><div class="avatar">${x.avatar}</div><div class="meta"><b>${esc(x.name)}${id===S.current?' · You':''}</b><div class="muted tiny">🔥 ${x.streak} day streak</div></div><b>${x.week} XP</b></div>`).join('')}function family(){let total=Object.values(S.profiles).reduce((a,x)=>a+x.week,0);shell(`<section class="screen"><div class="eyebrow">A little competition</div><h1>Family League</h1><p class="muted">The league ranks effort, not proficiency, so everyone can compete fairly.</p><div class="card"><div class="row"><b>Weekly family goal</b><b>${total}/600 XP</b></div><div class="prog" style="margin-top:10px"><span style="width:${Math.min(100,total/6)}%"></span></div></div><div class="card"><h2>Leaderboard</h2>${leaders()}</div><div class="card"><div class="eyebrow">Team challenge</div><h2 style="margin-top:4px">Everyone completes 3 lessons</h2><p class="muted tiny">Complete it together for a family reward.</p></div></section>`)}
function rewards(){shell(`<section class="screen"><div class="eyebrow">Shared motivation</div><h1>Family Rewards</h1><div class="hero"><div class="eyebrow" style="color:#90d7cc">Family balance</div><h1>🪙 ${S.coins} coins</h1><p>Earn coins together by hitting daily goals.</p></div>${S.rewards.map(r=>`<div class="reward"><div class="row"><div class="start"><div class="ico">${r[1]}</div><div><b>${esc(r[2])}</b><div class="muted tiny">${r[3]} coins</div></div></div><button class="soft" onclick="selectReward('${r[0]}')">${S.selected===r[0]?'Target':'Choose'}</button></div><div class="prog" style="margin-top:11px"><span style="width:${Math.min(100,S.coins/r[3]*100)}%"></span></div></div>`).join('')}</section>`)}function selectReward(id){S.selected=id;save();rewards()}
function profile(){shell(`<section class="screen"><div class="eyebrow">Your progress</div><h1>${esc(p().name)}’s Spanish</h1><div class="card"><div class="score" style="--v:${p().score}"><b>${p().score}</b></div><h2 style="text-align:center">${p().score<20?'Starting Out':p().score<40?'Holiday Basics':p().score<60?'Basic Conversation':p().score<80?'Comfortable Conversation':'Strong Everyday Conversation'}</h2><p class="muted tiny" style="text-align:center">An in-app progress score, not a formal language certificate.</p></div><div class="card"><div class="row"><b>Lessons completed</b><b>${p().done.length}/${LESSONS.length}</b></div><div class="prog" style="margin-top:10px"><span style="width:${p().done.length/LESSONS.length*100}%"></span></div></div><div class="card"><h2>Conversation Practice</h2><div class="grid">${Object.entries(CONV).map(([id,c])=>`<button class="activity" onclick="startConv('${id}')"><div class="ico">${c.emoji}</div><b>${c.title}</b><span class="muted tiny">+20 XP</span></button>`).join('')}</div></div>${S.current==='dave'?'<div class="card"><div class="eyebrow">Admin</div><h2 style="margin-top:4px">Testing controls</h2><button class="soft wide" onclick="resetAll()">Reset demo progress</button></div>':''}</section>`)}function resetAll(){if(confirm('Reset all Familingo progress on this device?')){S=structuredClone(BASE);save();go('home')}}
function profiles(){document.body.insertAdjacentHTML('beforeend',`<div class="modalbg" id="pm"><div class="modal"><div class="row"><div><div class="eyebrow">Who’s learning?</div><h1>Choose profile</h1></div><button class="soft" onclick="$('#pm').remove()">✕</button></div><div class="profiles">${Object.entries(S.profiles).map(([id,x])=>`<button class="prof ${id===S.current?'sel':''}" onclick="switchP('${id}')"><div style="font-size:30px">${x.avatar}</div><b>${esc(x.name)}</b><div class="muted tiny">${x.xp} XP · 🔥 ${x.streak}</div></button>`).join('')}</div></div></div>`)}function switchP(id){S.current=id;save();$('#pm').remove();render()}
function speak(t,rate=.85){if(!('speechSynthesis'in window))return toast('Audio is not supported here');speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=rate;speechSynthesis.speak(u)}function startConv(id){conv={id,...CONV[id]};ci=0;render()}function convScreen(){let s=conv.steps[ci];shell(`<section class="screen"><div class="row"><button class="soft" onclick="endConv()">✕</button><div class="meta"><div class="eyebrow">Conversation Practice</div><b>${conv.emoji} ${conv.title}</b></div></div><div style="margin-top:18px">${conv.steps.slice(0,ci).map(x=>`<div class="bubble bot">${esc(x[0])}<div class="muted tiny">${esc(x[1])}</div></div><div class="bubble user">${esc(x.chosen||x[2][0])}</div>`).join('')}<div class="bubble bot">${esc(s[0])}<div class="muted tiny">${esc(s[1])}</div></div></div><button class="soft wide" onclick="speak('${s[0].replaceAll("'","\\'")}')">🔊 Hear Spanish</button><h2 style="margin-top:18px">Your reply</h2>${s[2].map((x,i)=>`<button class="choice" onclick="choose(${i})">${esc(x)}</button>`).join('')}</section>`,false)}function choose(i){conv.steps[ci].chosen=conv.steps[ci][2][i];ci++;if(ci>=conv.steps.length){p().xp+=20;p().week+=20;p().score=Math.min(100,p().score+3);save();let t=conv.title;conv=null;shell(`<section class="screen" style="text-align:center;padding-top:55px"><div style="font-size:66px">💬</div><div class="eyebrow">Conversation complete</div><h1>${esc(t)}</h1><div style="font-size:42px;font-weight:900;color:#287970">+20 XP</div><p class="muted">That is the skill we’re building toward: understanding a situation and responding without freezing.</p><button class="btn wide" onclick="go('profile')">See my progress</button></section>`,false)}else convScreen()}function endConv(){conv=null;go('profile')}function toast(t){let e=document.createElement('div');e.className='toast';e.textContent=t;document.body.appendChild(e);setTimeout(()=>e.remove(),1800)}
render();
</script></body></html>
